<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для Умеды</title>
<style>
  /* ====== Цвета — можно менять ====== */
  :root{
    --scarlet:#d4102f; --scarlet-dark:#8f0a22; --scarlet-deep:#5a0010;
    --gold:#ffd9a8; --cream:#ffe9c9;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:"Noto Serif",Georgia,"Times New Roman",serif;
    background:linear-gradient(180deg,#12020a 0%,#3a0613 58%,#6e0a1f 100%);
    color:#fff;display:flex;align-items:center;justify-content:center;
    user-select:none;-webkit-user-select:none;touch-action:manipulation;
  }
  canvas.layer{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none}
  #stars{z-index:0;animation:twinkle 3.5s ease-in-out infinite alternate}
  #fx{z-index:1}
  @keyframes twinkle{from{opacity:.4}to{opacity:.9}}
  @keyframes fade{from{opacity:.45}to{opacity:1}}

  .wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:20px;padding:12px}
  .hint{font-size:15px;letter-spacing:.5px;color:var(--gold);text-align:center;min-height:22px;
        animation:fade 2.2s ease-in-out infinite alternate;transition:opacity .6s}
  .hint.off{opacity:0;animation:none}

  /* ====== Сцена и открытка ====== */
  .scene{perspective:1100px;width:min(84vw,330px);height:min(66vh,480px);animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .tilt{width:100%;height:100%;transform-style:preserve-3d;transition:transform .2s linear;will-change:transform}
  .card{position:relative;width:100%;height:100%;transform-style:preserve-3d}

  /* Внутренняя страница — старая бумага, на которой выжигается текст */
  .page{
    position:absolute;inset:0;border-radius:6px 20px 20px 6px;
    transform:translateZ(-1px);
    background:
      radial-gradient(ellipse at center,transparent 55%,rgba(130,70,15,.28) 100%),
      linear-gradient(160deg,#fbefd9,#f0dcb8);
    padding:26px 22px 18px;display:flex;flex-direction:column;
    box-shadow:0 12px 26px rgba(0,0,0,.5);
  }
  .page::before{content:"";position:absolute;inset:9px;border-radius:4px 14px 14px 4px;
    border:1.5px dashed rgba(143,10,34,.45);pointer-events:none}
  .to{font-size:20px;font-style:italic;margin-bottom:10px;min-height:28px;--end:#8f0a22}
  .msg{position:relative;flex:1;overflow-y:auto;font-size:clamp(14.5px,4.1vw,17px);line-height:1.6;-webkit-overflow-scrolling:touch}
  .msg::-webkit-scrollbar{width:0}
  .msg p{margin-bottom:11px}
  .sign{text-align:right;font-style:italic;font-size:17px;margin-top:6px;min-height:24px;--end:#8f0a22}

  /* Выжигание букв */
  .w{display:inline-block;white-space:nowrap}
  .c{opacity:0}
  .c.b{animation:burn 1.8s ease-out forwards}
  @keyframes burn{
    0%  {opacity:0;color:#fff6c8}
    8%  {opacity:1;color:#ffe066;text-shadow:0 0 6px #ff9a00}
    30% {color:#ff5a00;text-shadow:0 0 5px #ff3b00}
    65% {color:#7a2a08;text-shadow:0 0 2px rgba(255,80,0,.5)}
    100%{opacity:1;color:var(--end,#3a1408);text-shadow:0 0 1px rgba(60,20,0,.35)}
  }

  /* Обложка — открывается вокруг левого края */
  .cover{
    position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;
    transition:transform 1.7s cubic-bezier(.45,.05,.25,1);
  }
  .card.open .cover{transform:rotateY(-168deg)}
  .side{position:absolute;inset:0;border-radius:6px 20px 20px 6px;
    backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .out{
    background:linear-gradient(160deg,#e61c3c 0%,#b00c26 55%,#7d0016 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:28px 16px 26px;box-shadow:0 14px 28px rgba(0,0,0,.55);
  }
  .out::before{content:"";position:absolute;inset:9px;border-radius:4px 14px 14px 4px;
    border:1.5px solid rgba(255,217,168,.8);pointer-events:none}
  .out .small{font-size:13px;letter-spacing:6px;text-transform:uppercase;color:var(--gold)}
  .out h1{font-size:clamp(38px,12vw,52px);font-weight:normal;font-style:italic;text-align:center;
          color:var(--cream);text-shadow:0 2px 3px rgba(60,0,10,.55)}
  .out .tap{font-size:13px;color:var(--gold);text-align:center;margin-top:8px;animation:fade 2s ease-in-out infinite alternate}
  .in{
    transform:rotateY(180deg);
    background:linear-gradient(160deg,#a30d26,#6e0015);
  }
  .in::before{content:"";position:absolute;inset:9px;border-radius:14px 4px 4px 14px;
    border:1.5px solid rgba(255,217,168,.6)}

  /* ====== Замок-сердце ====== */
  .lock{
    position:absolute;left:50%;top:50%;width:130px;height:150px;margin:-78px 0 0 -65px;
    border:none;background:none;cursor:pointer;
    transform:translateZ(6px);
    transition:transform 1.3s cubic-bezier(.55,0,1,.7) .15s;
  }
  .lock svg{width:100%;height:100%;overflow:visible;animation:lockbeat 1.4s ease-in-out infinite}
  @keyframes lockbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
  .shackle{transform-origin:84px 62px;transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
  .lock.unlocked .shackle{transform:translateY(-14px) rotate(32deg)}
  .lock.fall{transform:translateZ(6px) translateY(140vh) rotate(28deg)}

  /* ====== Цепи ====== */
  .chains{position:absolute;inset:0;transform:translateZ(3px);pointer-events:none}
  .ch{position:absolute;left:50%;top:50%;width:0;height:0;
      transition:transform 1.3s cubic-bezier(.55,0,1,.7)}
  .ch i{position:absolute;left:0;top:-12px;width:330px;height:24px;transform-origin:0 50%;
        background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='24' viewBox='0 0 56 24'><rect x='1' y='3' width='34' height='18' rx='9' fill='none' stroke='%23383c46' stroke-width='5.5'/><rect x='1' y='3' width='34' height='18' rx='9' fill='none' stroke='%23c9ccd4' stroke-width='2.4'/><rect x='28' y='8' width='28' height='8' rx='4' fill='none' stroke='%23383c46' stroke-width='5'/><rect x='28' y='8' width='28' height='8' rx='4' fill='none' stroke='%23c9ccd4' stroke-width='2'/></svg>") repeat-x 0 0;}
  .ch.c1 i{transform:rotate(55deg) translateX(40px)}
  .ch.c2 i{transform:rotate(125deg) translateX(40px)}
  .ch.c3 i{transform:rotate(235deg) translateX(40px)}
  .ch.c4 i{transform:rotate(305deg) translateX(40px)}
  .chains.fall .c1{transform:translate(50px,130vh) rotate(40deg);transition-delay:.05s}
  .chains.fall .c2{transform:translate(-50px,130vh) rotate(-40deg);transition-delay:.15s}
  .chains.fall .c3{transform:translate(-70px,140vh) rotate(-65deg);transition-delay:.25s}
  .chains.fall .c4{transform:translate(70px,140vh) rotate(65deg);transition-delay:.1s}

  /* ====== Кнопка ====== */
  .btn{
    cursor:pointer;color:var(--cream);font-family:inherit;font-size:17px;
    padding:12px 26px;border-radius:40px;background:var(--scarlet);
    border:2px solid var(--gold);
    box-shadow:0 6px 14px rgba(0,0,0,.45);
    display:flex;align-items:center;gap:10px;
    opacity:0;pointer-events:none;transform:translateY(10px);
    transition:opacity .8s,transform .8s;
  }
  .btn.show{opacity:1;pointer-events:auto;transform:none}
  .btn:active{transform:scale(.95)}
  .btn svg{width:20px;height:18px}

  /* ====== Стартовый экран ====== */
  .intro{
    position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    background:radial-gradient(ellipse at center,#4a0612 0%,#12020a 100%);
    transition:opacity 1.2s,visibility 1.2s;text-align:center;padding:24px;cursor:pointer;
  }
  .intro.hide{opacity:0;visibility:hidden}
  .intro .big{font-size:clamp(26px,8vw,40px);font-style:italic;color:var(--cream);animation:fade 2.5s ease-in-out infinite alternate}
  .intro .heartbeat{width:96px;height:86px;overflow:visible;animation:ibeat 1.1s infinite}
  @keyframes ibeat{0%,100%{transform:scale(1)}15%{transform:scale(1.22)}30%{transform:scale(1)}45%{transform:scale(1.15)}}
  .intro .tap2{font-size:14px;color:var(--gold);animation:fade 2s ease-in-out infinite alternate}
</style>
</head>
<body>

<canvas id="stars" class="layer"></canvas>
<canvas id="fx" class="layer"></canvas>

<!-- Стартовый экран -->
<div class="intro" id="intro">
  <svg class="heartbeat" viewBox="0 0 100 90">
    <path d="M50 85C10 55 0 35 0 22C0 8 12 0 25 0C36 0 45 6 50 15C55 6 64 0 75 0C88 0 100 8 100 22C100 35 90 55 50 85Z" fill="#d4102f" stroke="#5a0010" stroke-width="7" stroke-linejoin="round"/>
    <path d="M50 85C10 55 0 35 0 22C0 8 12 0 25 0C36 0 45 6 50 15C55 6 64 0 75 0C88 0 100 8 100 22C100 35 90 55 50 85Z" fill="none" stroke="#ffd9a8" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M14 22C14 14 20 9 27 9" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <div class="big">Для самой особенной…</div>
  <div class="tap2">Нажми, чтобы открыть</div>
</div>

<div class="wrap">
  <div class="hint" id="hint">Нажми на сердце</div>

  <div class="scene">
    <div class="tilt" id="tilt">
      <div class="card" id="card">

        <!-- Страница с текстом -->
        <div class="page" id="page">
          <div class="to" id="to"></div>
          <div class="msg" id="msg"></div>
          <div class="sign" id="sign"></div>
        </div>

        <!-- Обложка -->
        <div class="cover">
          <div class="side out">
            <div class="small">С любовью</div>
            <div></div>
            <div>
              <h1 id="nameFront"></h1>
              <div class="tap" id="tap">нажми на сердце</div>
            </div>
          </div>
          <div class="side in"></div>
        </div>

        <!-- Цепи (падают при открытии замка) -->
        <div class="chains" id="chains">
          <div class="ch c1"><i></i></div>
          <div class="ch c2"><i></i></div>
          <div class="ch c3"><i></i></div>
          <div class="ch c4"><i></i></div>
        </div>

        <!-- Замок в виде сердца -->
        <button class="lock" id="lock" aria-label="Открыть замок">
          <svg viewBox="0 0 120 150">
            <g class="shackle" fill="none" stroke-linecap="round">
              <path d="M36 64V44a24 24 0 0 1 48 0V64" stroke="#383c46" stroke-width="10"/>
              <path d="M36 64V44a24 24 0 0 1 48 0V64" stroke="#d6d9e0" stroke-width="4.5"/>
            </g>
            <g transform="translate(10 56)">
              <path d="M50 85C10 55 0 35 0 22C0 8 12 0 25 0C36 0 45 6 50 15C55 6 64 0 75 0C88 0 100 8 100 22C100 35 90 55 50 85Z" fill="#d4102f" stroke="#5a0010" stroke-width="7" stroke-linejoin="round"/>
              <path d="M50 85C10 55 0 35 0 22C0 8 12 0 25 0C36 0 45 6 50 15C55 6 64 0 75 0C88 0 100 8 100 22C100 35 90 55 50 85Z" fill="none" stroke="#ffd9a8" stroke-width="2.8" stroke-linejoin="round"/>
              <path d="M14 22C14 14 20 9 27 9" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g fill="#2a0008" stroke="#2a0008" stroke-linecap="round">
              <circle cx="60" cy="88" r="7"/>
              <path d="M60 94V111" stroke-width="6"/>
            </g>
          </svg>
        </button>

      </div>
    </div>
  </div>

  <button class="btn" id="loveBtn">
    <svg viewBox="0 0 100 90"><path fill="#ffe9c9" d="M50 85C10 55 0 35 0 22C0 8 12 0 25 0C36 0 45 6 50 15C55 6 64 0 75 0C88 0 100 8 100 22C100 35 90 55 50 85Z"/></svg>
    <span>Я тоже тебя люблю</span>
  </button>
</div>

<script>
/* =========== НАСТРОЙКИ ТЕКСТА =========== */
const NAME = "Умеда";
const SIGNATURE = "Твой навсегда";
const PARAGRAPHS = [
  "С тех пор как ты появилась в моей жизни, всё стало светлее и теплее.",
  "Твоя улыбка — моё любимое утро, а твой голос — самая красивая музыка.",
  "Рядом с тобой я хочу быть лучше, добрее и сильнее. Ты — моё вдохновение и мой дом.",
  "Я люблю тебя, Умеда. Сегодня, завтра и всю жизнь."
];

/* =========== ПОДСТАНОВКА ТЕКСТА =========== */
document.title = "Для " + NAME;
document.getElementById("nameFront").textContent = NAME;
const msg = document.getElementById("msg");
const toEl = document.getElementById("to");
const signEl = document.getElementById("sign");
const loveBtn = document.getElementById("loveBtn");
const sleep = ms => new Promise(r=>setTimeout(r, ms));

/* раскладывает текст на буквы (невидимые, пока не выжжены) */
function prepare(el, text){
  const letters = [];
  const words = text.split(" ");
  words.forEach((word, wi)=>{
    const w = document.createElement("span");
    w.className = "w";
    for(const ch of word){
      const s = document.createElement("span");
      s.className = "c";
      s.textContent = ch;
      w.appendChild(s);
      letters.push(s);
    }
    el.appendChild(w);
    if(wi < words.length - 1) el.appendChild(document.createTextNode(" "));
  });
  return letters;
}

/* выжигает буквы одну за другой */
async function burn(letters){
  for(const s of letters){
    s.classList.add("b");
    const bottom = s.offsetTop + s.offsetHeight;          // прокрутка вслед за текстом
    if(bottom > msg.scrollTop + msg.clientHeight - 6){
      msg.scrollTop = bottom - msg.clientHeight + 30;
    }
    await sleep(/[.,—]/.test(s.textContent) ? 240 : 55);
  }
}

async function burnAll(){
  const toL = prepare(toEl, "Моя дорогая " + NAME + ",");
  const blocks = PARAGRAPHS.map(t=>{
    const p = document.createElement("p");
    msg.appendChild(p);
    return prepare(p, t);
  });
  const signL = prepare(signEl, SIGNATURE);

  await burn(toL);
  await sleep(400);
  for(const b of blocks){
    await burn(b);
    await sleep(450);
  }
  await burn(signL);
  await sleep(900);
  loveBtn.classList.add("show");
}

/* =========== ФОН: звёзды (рисуются один раз) =========== */
const starsC = document.getElementById("stars");
function drawStars(){
  starsC.width = innerWidth; starsC.height = innerHeight;
  const c = starsC.getContext("2d");
  c.fillStyle = "#ffe9c9";
  for(let i=0;i<40;i++){
    c.globalAlpha = Math.random()*.6+.15;
    c.beginPath();
    c.arc(Math.random()*starsC.width, Math.random()*starsC.height, Math.random()*1.2+.4, 0, 6.28);
    c.fill();
  }
}

/* =========== ЛЁГКИЕ ЧАСТИЦЫ: спрайты, 30 кадров/с =========== */
const fx = document.getElementById("fx");
const ctx = fx.getContext("2d");
let W, H;
function resize(){
  W = innerWidth; H = innerHeight;
  fx.width = W; fx.height = H;        // без devicePixelRatio — быстрее на слабых телефонах
  drawStars();
}
addEventListener("resize", resize); resize();

function makeSprite(color){
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  x.beginPath();
  x.moveTo(32,22);
  x.bezierCurveTo(32,8,10,8,10,26);
  x.bezierCurveTo(10,40,28,48,32,58);
  x.bezierCurveTo(36,48,54,40,54,26);
  x.bezierCurveTo(54,8,32,8,32,22);
  x.fillStyle = color; x.fill();
  x.lineJoin = "round"; x.strokeStyle = "rgba(60,0,10,.55)"; x.lineWidth = 2.5; x.stroke();
  return c;
}
const sprites = ["#e01b3a","#ff4d6a","#b00a25","#ff8a9a","#ffd9a8"].map(makeSprite);

const floaters = [], bursts = [];
function spawnFloater(){
  if(floaters.length > 10) return;
  floaters.push({
    x:Math.random()*W, y:H+20, s:Math.random()*20+16,
    vy:Math.random()*.7+.5, ph:Math.random()*6.28, sw:Math.random()*25+8,
    a:Math.random()*.4+.35, spr:sprites[Math.floor(Math.random()*sprites.length)]
  });
}
function burst(x, y, n){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.28, v = Math.random()*6+2;
    bursts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,s:Math.random()*16+12,life:1,
                 spr:sprites[Math.floor(Math.random()*sprites.length)]});
  }
}

let last = 0, frame = 0;
function loop(t){
  requestAnimationFrame(loop);
  if(document.hidden || t - last < 33) return;   // ~30 fps
  last = t; frame++;
  ctx.clearRect(0,0,W,H);
  if(frame % 26 === 0) spawnFloater();
  for(let i=floaters.length-1;i>=0;i--){
    const f = floaters[i];
    f.y -= f.vy; f.ph += .03;
    ctx.globalAlpha = f.a;
    ctx.drawImage(f.spr, f.x + Math.sin(f.ph)*f.sw, f.y, f.s, f.s);
    if(f.y < -40) floaters.splice(i,1);
  }
  for(let i=bursts.length-1;i>=0;i--){
    const b = bursts[i];
    b.x += b.vx; b.y += b.vy; b.vy += .22; b.vx *= .98; b.life -= .02;
    if(b.life <= 0){ bursts.splice(i,1); continue; }
    ctx.globalAlpha = b.life;
    ctx.drawImage(b.spr, b.x, b.y, b.s, b.s);
  }
  ctx.globalAlpha = 1;
}
requestAnimationFrame(loop);

/* =========== НАКЛОН ОТКРЫТКИ ЗА ПАЛЬЦЕМ / МЫШЬЮ =========== */
const tilt = document.getElementById("tilt");
let tx = 0, ty = 0, pending = false;
addEventListener("pointermove", e=>{
  tx = (e.clientX/innerWidth - .5)*2; ty = (e.clientY/innerHeight - .5)*2;
  if(pending) return; pending = true;
  requestAnimationFrame(()=>{
    pending = false;
    tilt.style.transform = "rotateY(" + (tx*14) + "deg) rotateX(" + (-ty*10) + "deg)";
  });
});

/* =========== СТАРТОВЫЙ ЭКРАН =========== */
document.getElementById("intro").addEventListener("click", function(){
  this.classList.add("hide");
  setTimeout(()=>burst(W/2, H/2, 40), 300);
});

/* =========== ЗАМОК: открывается, цепи падают, открытка раскрывается =========== */
const lock = document.getElementById("lock");
const chains = document.getElementById("chains");
const card = document.getElementById("card");
const hint = document.getElementById("hint");
let opened = false;

lock.addEventListener("click", ()=>{
  if(opened) return; opened = true;
  const r = lock.getBoundingClientRect();
  burst(r.left + r.width/2, r.top + r.height/2, 22);
  hint.classList.add("off");
  document.getElementById("tap").style.visibility = "hidden";
  lock.classList.add("unlocked");                                   // дужка замка открывается
  setTimeout(()=>{ chains.classList.add("fall"); lock.classList.add("fall"); }, 650);   // цепи и замок падают
  setTimeout(()=>card.classList.add("open"), 1700);                 // открытка раскрывается в 3D
  setTimeout(()=>{ chains.remove(); lock.remove(); }, 3200);
  setTimeout(burnAll, 3500);                                        // текст выжигается буква за буквой
});

/* =========== КНОПКА «Я ТОЖЕ ТЕБЯ ЛЮБЛЮ» =========== */
loveBtn.addEventListener("click", ()=>{
  const r = loveBtn.getBoundingClientRect();
  burst(r.left + r.width/2, r.top, 28);
  setTimeout(()=>burst(W*.25, H*.4, 20), 200);
  setTimeout(()=>burst(W*.75, H*.35, 20), 400);
  setTimeout(()=>burst(W*.5,  H*.25, 24), 650);
});
</script>
</body>
</html>
